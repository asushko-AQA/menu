# Проверка статики и генерации манифеста. Деплой Pages — в deploy-pages.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Generate manifest and content
        run: node scripts/generate-manifest.js

      - name: Validate JSON and relative links
        run: node scripts/check-static.js
