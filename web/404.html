<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Перенаправление…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #fbf7f1; color: #2a211a; }
    @media (prefers-color-scheme: dark) { body { background: #17130f; color: #f3ebe1; } a { color: #ff9d6c; } }
    a { color: #c4501e; }
  </style>
</head>
<body>
  <p>Перенаправляем… <a href="/menu/">Открыть меню</a></p>
  <script>
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('menu-redirect-path', path);
      window.location.replace('/menu/');
    })();
  </script>
</body>
</html>
